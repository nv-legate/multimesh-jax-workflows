---
name: Build docker image

on:
  workflow_call:
    inputs:
      stage:
        description: 'The Dockerfile stage to build up to'
        required: true
        type: string
      tag:
        description: 'The docker tag to append to the image: name:tag'
        required: true
        type: string
      base_image:
        description: 'The base stage/image to build maxtext from'
        default: 'None'
        type: string
      base_component:
        description: 'The base component to start building from'
        default: 'None'
        type: string

permissions:
  packages: write
  contents: read

jobs:
  build:
    runs-on: linux-amd64-cpu16

    defaults:
      run:
        shell: bash -xeuo pipefail {0}

    steps:
      - name: Echo input settings
        run: |
          echo "Base image     = ${{ inputs.base_image }}"
          echo "Base component = ${{ inputs.base_component }}"
          echo "Stage          = ${{ inputs.stage }}"
          echo "Tag            = ${{ inputs.tag }}"

      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.NV_LEGATE_INTER_REPOS_ACCESS_RO }}
          fetch-depth: 0

      - name: Stop all Docker containers
        run: |
          # Only try to stop if there are running containers.
          if [ -n "$(docker ps -q)" ]; then
            docker stop $(docker ps -q)
          fi

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: 3.12
          auto-update-conda: true
          use-mamba: true
          channels: conda-forge,defaults
          activate-environment: LJW

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate a development docker image
        env:
          JAX_APPLY_PATCHES: ${{ github.repository == 'nv-legate/multimesh-jax-workflows' && '1' || '0' }}
        run: |
          export CONDA_ENV=LJW

          activate_conda_env() {
              set +xu
              eval "$(conda shell.bash hook)"
              conda activate "${CONDA_ENV}";
              set -xu
          }

          activate_conda_env

          conda info

          ./bootstrap.sh

          cd docker
          ./build.py --no-cache --base-image ${{ inputs.base_image }} --base-component ${{ inputs.base_component }} --stage ${{ inputs.stage }}

      - name: Push image to ghcr.io
        run: |
          docker tag "multimesh-jax-dev:${{ inputs.stage }}" "ghcr.io/nv-legate/multimesh-jax-workflows.internal/multimesh-jax-dev:${{ inputs.tag }}"
          docker push "ghcr.io/nv-legate/multimesh-jax-workflows.internal/multimesh-jax-dev:${{ inputs.tag }}"

  test:
    if: inputs.stage == 'final_image'
    needs:
      - build

    runs-on: linux-amd64-gpu-l4-latest-1

    container:
      options: --cap-add SYS_ADMIN
      image: "ghcr.io/nv-legate/multimesh-jax-workflows.internal/multimesh-jax-dev:${{ inputs.tag }}"
      env:
        NVIDIA_VISIBLE_DEVICES: ${{ env.NVIDIA_VISIBLE_DEVICES }}

    defaults:
      run:
        shell: bash --noprofile --norc -xeuo pipefail {0}
        working-directory: /opt/workspace/multimesh-jax

    steps:
      - name: Run nvidia-smi to make sure GPU is working
        run: |
          echo "NVIDIA_VISIBLE_DEVICES=${{ env.NVIDIA_VISIBLE_DEVICES }}"
          nvidia-smi

      - name: Run Microbatch smoke test
        run: |
          /opt/entrypoint.sh python tests/python/jax_microbatch_test.py --cpus 1

      - name: Run Task unit tests
        run: |
          for n in 2 4 8; do
            /opt/entrypoint.sh python tests/python/jax_auto_task_test.py --cpus $n
          done

      - name: Run Maxtext validation
        run: |
          cd /opt/maxtext
          /opt/entrypoint.sh ./validate-cpu.sh

---
name: Build docker image

concurrency:
  group: ${{ startsWith(github.ref_name, 'main') && format('unique-{0}', github.run_id) || format('ci-build-docker-image-{0}-from-{1}', github.event_name, github.ref_name) }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "pull-request/[0-9]+"
      - "branch-*"
      - "main"
      - "sandeepd/add_ci"
  merge_group:

jobs:
  build:
    runs-on: linux-amd64-20cpu

    defaults:
      run:
        shell: bash -xeuo pipefail {0}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          submodules: true
          ssh-key: ${{ secrets.SSH_KEY_NV_SUBMODULES }}
          fetch-depth: 0
          path: legate-jax-workflows

      - name: Set environment variables
        run: |
          cd legate-jax-workflows
          echo "LEGATE_JAX_WORKFLOWS_DIR=$(pwd)" >> $GITHUB_ENV

          LEGATE_JAX_DIR=$(git config -f .gitmodules -l | .github/scripts/gitmodules2json.py | jq -r '."legate-jax".path')

          cd ${LEGATE_JAX_DIR}

          echo "LEGATE_JAX_DIR=$(pwd)" >> $GITHUB_ENV

          VERSIONS_JSON_FILE="$(pwd)/cmake/versions.json"

          echo "VERSIONS_JSON_FILE=${VERSIONS_JSON_FILE}" >> $GITHUB_ENV

      - name: Dump versions.json
        run: |
          cat ${VERSIONS_JSON_FILE}

      - name: Get submodule SHAs from versions.json
        run: |
          cd ${LEGATE_JAX_WORKFLOWS_DIR}

          # TODO: delete this line
          VERSIONS_JSON_FILE=./versions.json

          SUBMODULE_SHAS=$(git config -f .gitmodules -l | .github/scripts/gitmodules2json.py | jq -s '
            . as [ $obj1, $obj2 ]
            | $obj1
            | to_entries
            | map(select($obj2.packages[.key] != null))
            | map({ key: .value.path, value: $obj2.packages[.key].git_tag })
            | from_entries
          ' - ${VERSIONS_JSON_FILE} | jq -r 'to_entries | .[] | "\(.key) \(.value)"' -)
          echo "SUBMODULE_SHAS=${SUBMODULE_SHAS}" >> $GITHUB_ENV


      - name: Checkout submodules to SHAs specified in versions.json
        run: |
          # cd path/to/submodule
          # # git fetch --all
          # git submodule update --remote .
          # git checkout "$(cat ../../submodule-commit.txt)"
          echo ${SUBMODULE_SHAS}


      - name: Bootstrap submodules
        run: |
          cd legate-jax-workflows
          ./bootstrap.sh


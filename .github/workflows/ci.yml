---
name: Build docker image

concurrency:
  group: ${{ startsWith(github.ref_name, 'main') && format('unique-{0}', github.run_id) || format('ci-build-docker-image-{0}-from-{1}', github.event_name, github.ref_name) }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "pull-request/[0-9]+"
      - "branch-*"
      - "main"
      - "sandeepd/add_ci"
  merge_group:

jobs:
  build:
    # runs-on: linux-amd64-20cpu
    runs-on: linux-amd64-cpu16

    defaults:
      run:
        shell: bash -xeuo pipefail {0}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          submodules: true
          ssh-key: ${{ secrets.SSH_KEY_NV_SUBMODULES }}
          fetch-depth: 0

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: 3.12
          auto-update-conda: true
          use-mamba: true
          channels: conda-forge
          activate-environment: LJW

      - name: Generate a development docker image
        run: |
          export CONDA_ENV=LJW

          activate_conda_env() {
              set +xu
              eval "$(conda shell.bash hook)"
              conda activate "${CONDA_ENV}";
              set -xu
          }

          activate_conda_env

          conda info

          ./bootstrap.sh

          # cd docker
          # ./build.py --no-cache --framework maxtext

          docker build -t legate-jax-dev:maxtext - <<EOF
          FROM busybox
          CMD echo "Hello from Busybox"
          EOF

      - name: Save Docker image to file
        run: |
          cd ..
          mkdir artifacts
          cd artifacts
          echo "ARTIFACTS_DIR=$(pwd)" >> $GITHUB_ENV
          docker save legate-jax-dev:maxtext -o legate-jax-dev-maxtext.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: legate-jax-dev-maxtext
          path: "${{ env.ARTIFACTS_DIR }}/legate-jax-dev-maxtext.tar"
